<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeAlpha Image Gallery</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5ff;
  color: #202747;
}

header {
  background: linear-gradient(135deg, #172554, #4f46e5);
  color: white;
  text-align: center;
  padding: 35px 15px;
}

header h1 {
  margin: 0 0 10px;
  font-size: 32px;
}

header p {
  margin: 0;
}

.filters {
  text-align: center;
  padding: 25px 10px;
}

.filters button {
  border: none;
  padding: 11px 18px;
  margin: 5px;
  border-radius: 25px;
  background: white;
  color: #4338ca;
  cursor: pointer;
  font-weight: bold;
}

.filters button:hover,
.filters button.active {
  background: #4338ca;
  color: white;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  max-width: 1100px;
  margin: auto;
  padding: 15px;
}

.gallery img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 14px;
  cursor: pointer;
  transition: 0.3s;
}

.gallery img:hover {
  transform: scale(1.04);
}

.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.94);
  z-index: 10;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 50px 60px;
}

.lightbox.open {
  display: flex;
}

.lightbox img {
  max-width: 100%;
  max-height: 75vh;
  object-fit: contain;
  border-radius: 10px;
}

.lightbox p {
  color: white;
}

.lightbox button {
  position: absolute;
  border: none;
  border-radius: 50%;
  padding: 12px;
  font-size: 22px;
  cursor: pointer;
}

#close {
  top: 15px;
  right: 20px;
}

#prev {
  left: 10px;
  top: 50%;
}

#next {
  right: 10px;
  top: 50%;
}

footer {
  text-align: center;
  padding: 25px;
}

@media (max-width: 700px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }

  .gallery img {
    height: 170px;
  }
}

@media (max-width: 420px) {
  .gallery {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="lightbox" id="lightbox">
  <button id="close">✕</button>
  <button id="prev">❮</button>
  <img id="largeImage" src="" alt="Selected photo">
  <p id="caption"></p>
  <button id="next">❯</button>
</div>

<footer>
  <p>Every picture tells a beautifull story.</p>
</footer>

<script>
const images = Array.from(
  document.querySelectorAll(".gallery img")
);

const lightbox = document.getElementById("lightbox");
const largeImage = document.getElementById("largeImage");
const caption = document.getElementById("caption");

let visibleImages = images;
let currentIndex = 0;

function showImage(index) {
  if (visibleImages.length === 0) return;

  currentIndex =
    (index + visibleImages.length) % visibleImages.length;

  const photo = visibleImages[currentIndex];

  largeImage.src = photo.src;
  largeImage.alt = photo.alt;
  caption.textContent = photo.alt;

  lightbox.classList.add("open");
}

images.forEach(function(image) {
  image.addEventListener("click", function() {
    showImage(visibleImages.indexOf(image));
  });
});

document.getElementById("close").onclick = function() {
  lightbox.classList.remove("open");
};

document.getElementById("prev").onclick = function() {
  showImage(currentIndex - 1);
};

document.getElementById("next").onclick = function() {
  showImage(currentIndex + 1);
};

document.querySelectorAll(".filters button").forEach(
  function(button) {
    button.onclick = function() {
      document.querySelectorAll(".filters button")
        .forEach(function(item) {
          item.classList.remove("active");
        });

      button.classList.add("active");

      const category = button.dataset.category;

      visibleImages = images.filter(function(image) {
        return category === "all" ||
          image.dataset.category === category;
      });

      images.forEach(function(image) {
        image.style.display =
          visibleImages.includes(image) ? "block" : "none";
      });
    };
  }
);

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    lightbox.classList.remove("open");
  }

  if (lightbox.classList.contains("open")) {
    if (event.key === "ArrowRight") {
      showImage(currentIndex + 1);
    }

    if (event.key === "ArrowLeft") {
      showImage(currentIndex - 1);
    }
  }
});
</script>
